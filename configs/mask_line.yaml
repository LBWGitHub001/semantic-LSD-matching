# ==============================================================================
# Model Configuration: mask_line (6-Channel Continuous Geometry Field Line Matcher)
# ==============================================================================

model:
  model_type: "mask_line"
  family: "line"
  in_channels: 6
  d_model: 128

data_generation:
  task: "line"
  out_dir: "data/synthetic_line_scenes"
  num_scenes: 50
  views_per_scene: 8
  min_line_len: 16.0
  seed: 42

train:
  data_dir: "data/synthetic_line_scenes"
  epochs: 8
  lr: 0.0002
  weight_decay: 0.0001
  min_matches: 3
  grad_accum: 1
  amp: true
  device: "cuda"
  save_dir: "checkpoints/mask_line"
  val_interval: 1
  save_interval: 5
  max_steps: null

eval:
  checkpoint: "checkpoints/mask_line/latest"
  data_dir: "data/synthetic_line_scenes"
  split: "test"
  out_dir: "outputs/mask_line_eval"
  num_vis: 5
  device: "cuda"
  num_workers: 2
