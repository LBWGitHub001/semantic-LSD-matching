# ==============================================================================
# Model Configuration: semantic_line_matcher (Dual Region + Texture-Line Matcher)
# ==============================================================================

model:
  model_type: "semantic_line_matcher"
  family: "object"
  d_model: 128
  num_layers: 2
  nhead: 4
  use_pyramid: true
  with_geometry: true
  sinkhorn_iters: 20

data_generation:
  task: "semantic_line"
  out_dir: "data/synthetic_semantic_lines"
  num_scenes: 50
  views_per_scene: 8
  min_line_len: 16.0
  seed: 42

train:
  data_dir: "data/synthetic_semantic_lines"
  epochs: 12
  lr: 0.0005
  weight_decay: 0.0001
  dustbin_weight: 0.3
  region_weight: 1.0
  line_weight: 1.0
  sem_weight: 0.1
  geo_weight: 0.2
  adj_sigma: 0.3
  line_sample_points: 8
  min_area_ratio: 0.50
  grad_accum: 1
  amp: true
  device: "cuda"
  save_dir: "checkpoints/semantic_line_matcher"
  val_interval: 1
  save_interval: 5
  max_steps: null

eval:
  checkpoint: "checkpoints/semantic_line_matcher/latest"
  data_dir: "data/synthetic_semantic_lines"
  split: "test"
  out_dir: "outputs/semantic_line_eval"
  min_area_ratio: 0.50
  num_vis: 5
  device: "cuda"
  num_workers: 2
