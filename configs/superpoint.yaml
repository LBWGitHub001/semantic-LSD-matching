# ==============================================================================
# Model Configuration: SuperPoint (Interest Points & Line Geometry)
# ==============================================================================

model:
  model_type: "SuperPoint"
  family: "point"
  in_channels: 5
  d_model: 256
  descriptor_dim: 256

data_generation:
  task: "planar_letters"              # Options: planar_letters, descriptor_shapes
  out_dir: "data/planar_letters"      # Output dataset path
  num_scenes: 26                      # Alphabet letters A through Z
  views_per_scene: 4                  # Views per character scene
  seed: 42

train:
  data_dir: "data/planar_letters"
  train_stage: "joint"                # Options: joint, detector, descriptor
  epochs: 15
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 1
  grad_accum: 1
  amp: true
  device: "cuda"
  save_dir: "checkpoints/SuperPoint"
  val_interval: 1
  save_interval: 5
  max_steps: null                     # null for full epoch; set integer for dry run

  # ============================================================================
  # SuperPoint Loss Weights (各损失项 Lambda 权重与几何拓扑超参数)
  # ============================================================================
  # 1. 描述子分支度量损失 (Descriptor Metric Hinge Loss)
  weight_desc: 1.0                    # lambda_desc: 描述子总体损失加权系数
  positive_weight: 250.0              # 正样本点对在 Hinge Loss 中的加权系数 (拉近同名点)
  positive_margin: 1.0                # 正样本重投影距离内的截断边缘 (m_p)
  negative_margin: 0.2                # 负样本点对的截断边缘 (m_n)

  # 2. 端点检测分支损失 (Endpoint Detector Cross-Entropy Loss)
  weight_det: 1.0                     # lambda_det: 关键点/端点检测网格分类交叉熵损失权重
  det_pos_weight: 50.0                # 65 通道网格中端点正样本类的加权系数

  # 3. 直线几何拓扑辅助损失 (Line Geometric Losses)
  weight_orphan: 1.0                  # lambda_orphan: 孤立未连线端点几何惩罚权重
  weight_len: 0.5                     # lambda_len: 超线性长线收益奖励权重
  length_exponent: 1.5                # 超线性长线收益指数幂 (指数越大，超长线收益越陡峭)
  weight_premature: 0.5               # lambda_premature: 端点外推射线探针早退惩罚权重
  probe_dist: 4.0                     # 外推射线探针像素距离 (px)

  # 4. 直线几何拓扑合法性判定阈值与采样
  tau_df: 0.55                        # 距离场脊线对齐阈值 (>= 此值判定为在线上)
  tau_ang: 0.10                       # 角度场切线方向一致性阈值
  min_length: 8.0                     # 最短成线长度阈值 (px)
  num_candidates: 16                  # 候选端点提取 Top-K 数量
  num_line_samples: 10                # 两点间插值采样点数

  # 5. 线级一致性与对比推离损失 (方案 A: 同一线值相似，跨图同线相同，异线与背景推离)
  nms_radius: 4                       # 局部极大值抑制 (NMS) 半径 (px)
  weight_intra: 1.0                   # 线内像素一致性损失权重 (同一条线上值相似)
  weight_cross: 1.5                   # 跨视角同名直线原型对齐损失权重 (不同图同一直线相同)
  weight_inter: 0.5                   # 异线原型相互推离对比损失权重
  weight_bg: 0.3                      # 背景像素与线原型推离损失权重 (方案 A)
  line_neg_margin: 0.2                # 异线负安全截断边际
  bg_neg_margin: 0.1                  # 背景负安全截断边际
  num_line_points: 12                 # 每条线段沿线密集均匀采样点数
  num_bg_samples: 64                  # 随机背景负采样点数

eval:
  checkpoint: "checkpoints/SuperPoint/latest"
  data_dir: "data/planar_letters"
  split: "val"                        # Options: train, val, test
  eval_stage: "all"                   # Options: all, detector, descriptor
  out_dir: "outputs/superpoint_eval"
  num_vis: 5
  device: "cuda"
  num_workers: 2

  # 评测与可视化几何线段提取阈值
  tau_df: 0.55
  tau_ang: 0.10
  min_length: 8.0
  num_candidates: 16
  num_line_samples: 10
